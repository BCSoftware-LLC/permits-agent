[project]
name = "abc-agent"
version = "0.1.0"
description = "BC Software internal (Permits N More): agent-native gateway for California ABC public data — MCP server + CLI over a daily-synced local mirror. Repo: BCSoftware-LLC/permits-agent"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.0",
    "fastmcp>=2.0",
    "typer>=0.12",
]

[project.scripts]
abc-agent = "abcgov.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["abcgov"]
